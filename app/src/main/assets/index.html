<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102b52"><title>مدرستي</title>
<style>
:root{--navy:#102b52;--blue:#19477c;--gold:#f3bd4a;--bg:#f3f6fb;--ink:#172b46;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--navy),#24609a);color:white;padding:22px 18px 25px;border-radius:0 0 25px 25px}.brand{font-size:27px;font-weight:800}.gold{color:var(--gold)}header p{margin:7px 0 0;color:#dbeafe;font-size:13px}main{padding:15px;max-width:760px;margin:auto}.welcome{font-size:20px;font-weight:800;margin:7px 0 14px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat,.panel,.navbtn{background:white;border:1px solid #e4eaf3;border-radius:17px;padding:15px;box-shadow:0 5px 15px #17385d0a}.ico{font-size:26px}.stat strong{display:block;font-size:25px;margin:8px 0 3px;color:var(--navy)}.stat span{font-size:13px;color:var(--muted)}.section-title{font-weight:800;font-size:18px;margin:22px 0 11px}.navgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.navbtn{display:flex;align-items:center;gap:11px;text-align:right;font-weight:700;color:var(--ink);font-size:15px;min-height:74px;border:0}.navbtn b{font-size:26px}.panel{margin-top:13px}.panel h3{margin:0 0 12px}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}.field label{font-size:13px;font-weight:bold;color:#475569}input,select{font:inherit;padding:12px;border:1px solid #d6deeb;border-radius:10px;background:#fbfdff;width:100%}button{font:inherit;cursor:pointer}.primary,.secondary,.danger{border:0;border-radius:11px;padding:12px 15px;font-weight:bold}.primary{background:var(--navy);color:white}.secondary{background:#e8f0fb;color:var(--navy)}.danger{background:#fff0f0;color:#a12626}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.hidden{display:none!important}.back{margin-bottom:12px}.foot{text-align:center;color:#8a98ab;font-size:12px;padding:24px 0}.record{padding:12px 0;border-bottom:1px solid #e8edf5;display:flex;align-items:center;justify-content:space-between;gap:8px}.record small{display:block;color:var(--muted);margin-top:4px}.empty{color:var(--muted);font-size:14px;padding:12px 0}@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.navgrid{grid-template-columns:repeat(3,1fr)}}@media print{header,.back,.navgrid,.actions,.field,button{display:none!important}body{background:white}.panel,.stat{box-shadow:none}}
</style></head><body><header><div class="brand">🏫 مدرستي <span class="gold">✦</span></div><p>نظام مبسّط لإدارة المدرسة · لوحة الإدارة</p></header><main>
<div id="home"><div class="welcome">أهلاً بك في مدرستك 👋</div><div class="stats"><div class="stat"><div class="ico">👩‍🎓</div><strong id="sStudents">0</strong><span>الطلاب</span></div><div class="stat"><div class="ico">👨‍🏫</div><strong id="sTeachers">0</strong><span>المعلمون</span></div><div class="stat"><div class="ico">🏫</div><strong id="sClasses">0</strong><span>الصفوف</span></div><div class="stat"><div class="ico">📋</div><strong id="sAttendance">0</strong><span>سجلات الدوام</span></div></div><div class="section-title">أقسام المدرسة</div><div class="navgrid"><button class="navbtn" onclick="openSection('students')"><b>👩‍🎓</b> إدارة الطلاب</button><button class="navbtn" onclick="openSection('teachers')"><b>👨‍🏫</b> المعلمون</button><button class="navbtn" onclick="openSection('classes')"><b>🏫</b> الصفوف والشُعب</button><button class="navbtn" onclick="openSection('attendance')"><b>🗓️</b> الحضور والغياب</button><button class="navbtn" onclick="openSection('building')"><b>🧱</b> مبنى المدرسة</button><button class="navbtn" onclick="openSection('reports')"><b>📊</b> التقارير والنسخ</button></div><div class="foot">مدرستي · البيانات محفوظة على هذا الجهاز</div></div>
<div id="section" class="hidden"><button class="secondary back" onclick="goHome()">← الرئيسية</button><h2 id="sectionTitle"></h2><div id="sectionBody"></div></div></main>
<script>
const titles={students:'إدارة الطلاب',teachers:'المعلمون',classes:'الصفوف والشُعب',attendance:'الحضور والغياب',building:'مبنى المدرسة',reports:'التقارير والنسخ'};
const kinds={students:[['name','اسم الطالب'],['grade','الصف'],['guardian','اسم ولي الأمر'],['phone','رقم ولي الأمر']],teachers:[['name','اسم المعلم'],['subject','المادة'],['phone','رقم الهاتف']],classes:[['name','اسم الصف/الشعبة'],['room','رقم الغرفة'],['supervisor','مربي الصف']],attendance:[['name','اسم الطالب'],['date','التاريخ','date'],['status','الحالة','select','حاضر,غائب,متأخر'],['note','ملاحظات']],building:[['name','اسم المرفق'],['location','الموقع'],['status','الحالة','select','جيد,بحاجة لصيانة,قيد الصيانة'],['note','ملاحظات']]};
let data={students:[],teachers:[],classes:[],attendance:[],building:[]};try{data={...data,...JSON.parse(localStorage.getItem('madrasati_data')||'{}')}}catch(e){}let current='';
function save(){localStorage.setItem('madrasati_data',JSON.stringify(data));updateStats()}
function updateStats(){for(const [k,id] of [['students','sStudents'],['teachers','sTeachers'],['classes','sClasses'],['attendance','sAttendance']])document.getElementById(id).textContent=(data[k]||[]).length}
function goHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('section').classList.add('hidden');updateStats()}
function openSection(k){current=k;document.getElementById('home').classList.add('hidden');document.getElementById('section').classList.remove('hidden');document.getElementById('sectionTitle').textContent=titles[k];render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let root=document.getElementById('sectionBody');if(current==='reports'){root.innerHTML='<div class="panel"><h3>📊 ملخص المدرسة</h3><p>عدد الطلاب: '+data.students.length+'</p><p>عدد المعلمين: '+data.teachers.length+'</p><p>عدد الصفوف: '+data.classes.length+'</p><p>سجلات الحضور: '+data.attendance.length+'</p><div class="actions"><button class="primary" onclick="exportBackup()">📦 تصدير نسخة احتياطية</button><button class="secondary" onclick="shareReport()">📲 مشاركة التقرير</button><button class="secondary" onclick="window.print()">🖨️ طباعة / حفظ PDF</button></div><div class="field"><label>استعادة نسخة JSON</label><input type="file" accept=".json,application/json" onchange="importBackup(event)"></div></div>';return}let fields=kinds[current].map((f,i)=>'<div class="field"><label>'+f[1]+'</label>'+(f[2]==='select'?'<select id="f'+i+'">'+f[3].split(',').map(x=>'<option>'+x+'</option>').join('')+'</select>':'<input id="f'+i+'" type="'+(f[2]||'text')+'" placeholder="'+f[1]+'">')+'</div>').join('');root.innerHTML='<div class="panel"><h3>➕ إضافة سجل جديد</h3>'+fields+'<button class="primary" onclick="addRecord()">حفظ السجل</button></div><div class="panel"><h3>السجلات المسجلة ('+data[current].length+')</h3><div id="records">'+listRecords()+'</div></div>'}
function listRecords(){if(!data[current].length)return '<div class="empty">لا توجد سجلات بعد. أضف أول سجل من الأعلى.</div>';return data[current].map((r,i)=>'<div class="record"><div><strong>'+esc(r.name||'سجل')+'</strong><small>'+esc(Object.entries(r).filter(([k,v])=>k!=='name'&&v).map(([k,v])=>v).join(' · '))+'</small></div><button class="danger" onclick="removeRecord('+i+')">حذف</button></div>').join('')}
function addRecord(){let r={};kinds[current].forEach((f,i)=>r[f[0]]=document.getElementById('f'+i).value.trim());if(!r.name){alert('يرجى إدخال الاسم أو اسم السجل');return}data[current].push(r);save();render();alert('تم حفظ السجل على هذا الجهاز')}
function removeRecord(i){if(confirm('هل تريد حذف هذا السجل؟')){data[current].splice(i,1);save();render()}}
function exportBackup(){const s=JSON.stringify({app:'مدرستي',version:1,exportedAt:new Date().toISOString(),data},null,2);if(window.Madrasati)Madrasati.exportBackup(s);else{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'application/json'}));a.download='madrasati-backup.json';a.click();URL.revokeObjectURL(a.href)}}
function importBackup(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const obj=JSON.parse(rd.result);if(!obj.data)throw Error();if(confirm('سيتم استبدال البيانات الحالية بالنسخة المختارة. متابعة؟')){data={...data,...obj.data};save();render();alert('تمت استعادة النسخة')}}catch(x){alert('الملف غير صالح أو ليس نسخة مدرستي')}};rd.readAsText(f)}
function shareReport(){let t='تقرير مدرسة مدرستي\nالطلاب: '+data.students.length+'\nالمعلمون: '+data.teachers.length+'\nالصفوف: '+data.classes.length+'\nسجلات الحضور: '+data.attendance.length;if(window.Madrasati)Madrasati.share(t);else if(navigator.share)navigator.share({text:t});else alert(t)}
updateStats();
</script></body></html>
